name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Dependency audit (pip-audit)
        run: uv run --with pip-audit pip-audit --skip-editable

  frontend:
    name: Frontend (oxlint + vitest + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm test
      - run: npm run build
      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high

  sdk-conformance:
    name: SDK conformance (twilio-python + twilio-node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start smspit API
        run: |
          cd backend
          uv sync --frozen
          nohup uv run uvicorn app.main:app --port 8025 &
          for i in $(seq 1 30); do
            curl -sf localhost:8025/api/health && break
            sleep 1
          done
      - name: Run twilio-python conformance suite
        run: uv run --project conformance/python pytest conformance/python -v
      - name: Run twilio-node conformance suite
        run: |
          npm --prefix conformance/node install
          npm --prefix conformance/node test

  e2e:
    name: Dashboard E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Start smspit (API + static dashboard, one port)
        run: |
          cd backend
          uv sync --frozen
          nohup env SMSPIT_STATIC_DIR=../frontend/dist uv run uvicorn app.main:app --port 8025 &
          for i in $(seq 1 30); do
            curl -sf localhost:8025/api/health && break
            sleep 1
          done
      - name: Run Playwright suite
        run: |
          cd e2e
          npm install
          npx playwright install --with-deps chromium
          npx playwright test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend, sdk-conformance, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Semver image tags come from git tags: pushing v1.2.3 publishes
      # 1.2.3, 1.2, 1 (and latest from the default branch).
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push multi-arch on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs build amd64 only for speed; pushes publish both architectures.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
