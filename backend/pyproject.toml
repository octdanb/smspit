[project]
name = "smspit-backend"
# Cosmetic: the running app reports the SMSPIT_VERSION env (stamped from the
# git tag at image build time), not this number.
version = "0.3.0"
description = "smspit — Twilio-emulating SMS mock service backend"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.27",
    "phonenumbers>=9.0.36",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
