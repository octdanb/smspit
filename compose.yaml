services:
  smspit:
    # Build from source, or comment this out and use the published image:
    # image: ghcr.io/octdanb/octavenz-smspit:latest
    build: .
    ports:
      - "8025:8025"
    volumes:
      - ./data:/data
    # Pass SMSPIT_* settings (e.g. SMSPIT_DASHBOARD_TOKEN) via a .env file if present.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8025/api/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
