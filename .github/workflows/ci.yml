name: CI

on:
  push:
    branches: [main]
    # Release tags: canonical form is v0.2.0, but V0.2.0 and bare 0.2.0
    # also trigger and publish correctly (both mistakes have happened).
    tags: ["v*.*.*", "V*.*.*", "[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

# Cancel superseded runs on PRs; never cancel a main/tag build mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Dependency audit (pip-audit)
        run: uv run --with pip-audit pip-audit --skip-editable

  frontend:
    name: Frontend (oxlint + vitest + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run fmt:check
      - run: pnpm test
      - run: pnpm run build
      - name: Dependency audit (pnpm audit)
        run: pnpm audit --audit-level high

  sdk-conformance:
    name: SDK conformance (twilio-python + twilio-node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          # The API server runs backgrounded for the whole job; skip the post-run
          # cache prune, which otherwise blocks on the live uv process.
          prune-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start smspit API
        run: |
          cd backend
          uv sync --frozen
          # Run the venv binary directly, not `uv run`, so no uv supervisor
          # process lingers holding a lock on the shared cache directory.
          nohup .venv/bin/uvicorn app.main:app --port 8025 &
          for i in $(seq 1 30); do
            curl -sf localhost:8025/api/health && exit 0
            sleep 1
          done
          echo "smspit API failed to start"; exit 1
      - name: Run twilio-python conformance suite
        run: uv run --project conformance/python pytest conformance/python -v
      - name: Run twilio-node conformance suite
        # SDK version floats on purpose (catch upstream drift), so no frozen lockfile.
        run: |
          cd conformance/node
          pnpm install --no-frozen-lockfile
          pnpm test

  e2e:
    name: Dashboard E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          # The API server runs backgrounded for the whole job; skip the post-run
          # cache prune, which otherwise blocks on the live uv process.
          prune-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build dashboard
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Start smspit (API + static dashboard, one port)
        run: |
          cd backend
          uv sync --frozen
          # Run the venv binary directly, not `uv run`, so no uv supervisor
          # process lingers holding a lock on the shared cache directory.
          nohup env SMSPIT_STATIC_DIR=../frontend/dist .venv/bin/uvicorn app.main:app --port 8025 &
          for i in $(seq 1 30); do
            curl -sf localhost:8025/api/health && exit 0
            sleep 1
          done
          echo "smspit failed to start"; exit 1
      - name: Run Playwright suite
        run: |
          cd e2e
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

  docker:
    name: Docker image (build, smoke test, scan, publish)
    runs-on: ubuntu-latest
    needs: [backend, frontend, sdk-conformance, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Semver image tags come from git tags: pushing v1.2.3 (or V1.2.3 or
      # 1.2.3) publishes 1.2.3, 1.2, 1 (and latest from the default branch).
      # type=match instead of type=semver so the v prefix is optional and
      # case-insensitive.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=match,pattern=^[vV]?(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^[vV]?(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^[vV]?(\d+)\.\d+\.\d+$,group=1
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Build amd64 once and load it so we can smoke-test and scan the real
      # image before anything is published.
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smspit:ci
          build-args: |
            SMSPIT_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smspit -p 8025:8025 smspit:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8025/api/health && ok=1 && break
            sleep 1
          done
          if [ "${ok:-}" != 1 ]; then docker logs smspit; echo "container did not become healthy"; exit 1; fi
          curl -sf localhost:8025/ | grep -q 'id="root"' || { echo "dashboard not served"; exit 1; }
          curl -sf localhost:8025/api/version
          docker rm -f smspit

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: smspit:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # Publish multi-arch with an SBOM and max provenance attestation. Reuses
      # the amd64 layers from the test build, so only arm64 is new.
      - name: Build and push (main/tags)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SMSPIT_VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
